# APK 内测分发站 —— 纯静态，无后端进程
server {
    listen 80;
    listen [::]:80;
    server_name apk.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name apk.example.com;

    ssl_certificate     /etc/letsencrypt/live/apk.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/apk.example.com/privkey.pem;

    root /var/www/apk-publisher;
    index index.html;
    autoindex off;

    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy no-referrer always;

    # 下载页：每次发布后要立刻看到新版本，禁缓存
    location = / {
        add_header Cache-Control "no-store, must-revalidate" always;
        try_files /index.html =404;
    }

    # APK：文件名带发布时间戳，同一路径的内容永不改变，可长缓存
    location ~ \.apk$ {
        types { }
        default_type application/vnd.android.package-archive;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        gzip off;
    }

    # 上传中的临时文件不对外暴露
    location ~ \.part$ { return 404; }
}
